<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Uygulaması</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #6c63ff;
    }

    .input-row button {
      padding: 10px 18px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover {
      background: #574fd6;
    }

    .input-row button:disabled {
      background: #b0acf0;
      cursor: not-allowed;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      flex: 1;
      padding: 7px;
      border: 2px solid #e0e0e0;
      background: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #666;
      transition: all 0.2s;
    }

    .filters button.active {
      border-color: #6c63ff;
      color: #6c63ff;
      font-weight: 600;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #f8f8ff;
      border-radius: 8px;
      border: 1px solid #ebebff;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6c63ff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item span {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      word-break: break-word;
    }

    .todo-item.done span {
      text-decoration: line-through;
      color: #aaa;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1.1rem;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .todo-item .delete-btn:hover {
      color: #e74c3c;
    }

    .footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: #999;
    }

    .footer button {
      background: none;
      border: none;
      cursor: pointer;
      color: #e74c3c;
      font-size: 0.82rem;
    }

    .footer button:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
      padding: 24px 0;
    }

    .loading {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
      padding: 24px 0;
    }

    .error-msg {
      background: #fff0f0;
      color: #c0392b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Yapılacaklar</h1>

    <div class="input-row">
      <input type="text" id="todoInput" placeholder="Yeni görev ekle..." maxlength="120">
      <button id="addBtn" title="Ekle">+</button>
    </div>

    <div id="errorBox"></div>

    <div class="filters">
      <button class="active" data-filter="all">Tümü</button>
      <button data-filter="active">Bekleyen</button>
      <button data-filter="done">Tamamlanan</button>
    </div>

    <ul class="todo-list" id="todoList"><p class="loading">Yükleniyor...</p></ul>

    <div class="footer">
      <span id="countLabel"></span>
      <button id="clearDone">Tamamlananları sil</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cirjgldokhlwqduwfukh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpcmpnbGRva2hsd3FkdXdmdWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjc4NDUsImV4cCI6MjA5Mzc0Mzg0NX0.6UF44Ci0yoEJQyGws_xI385vsP6LMHCd2MBRP2ji_gA';
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    let todos = [];
    let filter = 'all';

    const input      = document.getElementById('todoInput');
    const addBtn     = document.getElementById('addBtn');
    const list       = document.getElementById('todoList');
    const countLbl   = document.getElementById('countLabel');
    const clearBtn   = document.getElementById('clearDone');
    const errorBox   = document.getElementById('errorBox');
    const filterBtns = document.querySelectorAll('.filters button');

    function showError(msg) {
      errorBox.innerHTML = `<div class="error-msg">${msg}</div>`;
      setTimeout(() => errorBox.innerHTML = '', 4000);
    }

    async function api(path, options = {}) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        headers: HEADERS,
        ...options
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Bir hata oluştu');
      }
      const text = await res.text();
      return text ? JSON.parse(text) : [];
    }

    async function loadTodos() {
      try {
        todos = await api('todos?order=created_at.desc');
        render();
      } catch (e) {
        showError('Görevler yüklenemedi: ' + e.message);
        list.innerHTML = '<p class="empty">Yüklenemedi.</p>';
      }
    }

    async function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      addBtn.disabled = true;
      try {
        const [newTodo] = await api('todos', {
          method: 'POST',
          body: JSON.stringify({ text, done: false })
        });
        todos.unshift(newTodo);
        input.value = '';
        render();
      } catch (e) {
        showError('Eklenemedi: ' + e.message);
      } finally {
        addBtn.disabled = false;
      }
    }

    async function toggleTodo(id, done) {
      try {
        const [updated] = await api(`todos?id=eq.${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ done })
        });
        const idx = todos.findIndex(t => t.id === id);
        if (idx !== -1) todos[idx] = updated;
        render();
      } catch (e) {
        showError('Güncellenemedi: ' + e.message);
        render();
      }
    }

    async function deleteTodo(id) {
      try {
        await api(`todos?id=eq.${id}`, { method: 'DELETE' });
        todos = todos.filter(t => t.id !== id);
        render();
      } catch (e) {
        showError('Silinemedi: ' + e.message);
      }
    }

    async function clearDone() {
      const doneIds = todos.filter(t => t.done).map(t => t.id);
      if (!doneIds.length) return;
      try {
        await api(`todos?id=in.(${doneIds.join(',')})`, { method: 'DELETE' });
        todos = todos.filter(t => !t.done);
        render();
      } catch (e) {
        showError('Silinemedi: ' + e.message);
      }
    }

    function render() {
      const visible = todos.filter(t =>
        filter === 'all'    ? true :
        filter === 'active' ? !t.done :
                               t.done
      );

      list.innerHTML = '';

      if (visible.length === 0) {
        list.innerHTML = '<p class="empty">Görev yok.</p>';
      } else {
        visible.forEach(t => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (t.done ? ' done' : '');
          li.innerHTML = `
            <input type="checkbox" ${t.done ? 'checked' : ''} data-id="${t.id}">
            <span>${escHtml(t.text)}</span>
            <button class="delete-btn" data-id="${t.id}" title="Sil">&#x2715;</button>
          `;
          list.appendChild(li);
        });
      }

      const remaining = todos.filter(t => !t.done).length;
      countLbl.textContent = `${remaining} görev bekliyor`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

    list.addEventListener('change', e => {
      if (e.target.type === 'checkbox') {
        const id = Number(e.target.dataset.id);
        toggleTodo(id, e.target.checked);
      }
    });

    list.addEventListener('click', e => {
      if (e.target.classList.contains('delete-btn')) {
        deleteTodo(Number(e.target.dataset.id));
      }
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    clearBtn.addEventListener('click', clearDone);

    loadTodos();
  </script>
</body>
</html>
